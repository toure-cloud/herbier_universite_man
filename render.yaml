databases:
  # Base PostgreSQL pour l'admin (elle contient tout : SuperAdmin, Audit, contenu, etc.)
  - name: herbier-admin-db
    databaseName: herbier_admin_db
    user: herbier_admin
    plan: free

services:
  # ============================================
  # BACKEND ADMIN (Django)
  # ============================================
  - type: web
    name: herbier-admin-backend
    runtime: python
    plan: free
    region: frankfurt   # ou oregon, à adapter selon ta localisation
    rootDir: admin-backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn admin_auth.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: herbier-admin-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://herbier-admin-frontend.onrender.com,https://herbier-frontend.onrender.com"

  # ============================================
  # BACKEND PUBLIC (Django)
  # ============================================
  - type: web
    name: herbier-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn herbier_backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: herbier-admin-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ADMIN_API_URL
        value: "https://herbier-admin-backend.onrender.com/api"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://herbier-frontend.onrender.com,https://herbier-admin-frontend.onrender.com"

  # ============================================
  # FRONTEND ADMIN (Vue Static Site)
  # ============================================
  - type: web
    name: herbier-admin-frontend
    runtime: static
    rootDir: admin-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://herbier-admin-backend.onrender.com/api"

  # ============================================
  # FRONTEND PUBLIC (Vue Static Site)
  # ============================================
  - type: web
    name: herbier-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://herbier-backend.onrender.com/api"
      - key: VITE_ADMIN_MEDIA_URL
        value: "https://herbier-admin-backend.onrender.com"